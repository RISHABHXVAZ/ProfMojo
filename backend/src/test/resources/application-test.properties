# Test properties
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false
spring.flyway.enabled=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC

# In-memory / Mock mail configuration
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test-user
spring.mail.password=test-pass
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Test JWT Secret (HMAC SHA-256 requires >= 256 bits)
jwt.secret=test-super-secret-jwt-key-2026-profmojo-secure-signing-token-must-be-long-enough
jwt.expiration=3600000

# Test Department Seed
app.admin.department.seeds=CSE:admin@testuniversity.edu:test-secret-999

# Frontend URL
app.frontend.url=http://localhost:5173

# Redis test settings
spring.data.redis.timeout=1000

# Test Rate Limiting Defaults
profmojo.ratelimit.send-otp.ip.limit=3
profmojo.ratelimit.send-otp.ip.window-seconds=60
profmojo.ratelimit.send-otp.user.limit=2
profmojo.ratelimit.send-otp.user.window-seconds=300
profmojo.ratelimit.trust-proxy-headers=false
management.health.mail.enabled=false
