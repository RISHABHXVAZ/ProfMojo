# ===============================
# DATASOURCE
# ===============================
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/profmojo}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:profmojo}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:profmojo}}

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=false

# ===============================
# MAIL CONFIG
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ===============================
# TIMEZONE
# ===============================
spring.jackson.time-zone=Asia/Kolkata
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

app.admin.department.seeds=${ADMIN_DEPARTMENT_SEEDS:}

app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ===============================
# JWT CONFIG
# ===============================
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:36000000}

# ===============================
# REDIS / IN-MEMORY DATASTORE
# ===============================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000

# ===============================
# RATE LIMITING (Configurable)
# ===============================
# IP-based send-otp limit: 3 requests per 60 seconds
profmojo.ratelimit.send-otp.ip.limit=${RATELIMIT_SEND_OTP_IP_LIMIT:3}
profmojo.ratelimit.send-otp.ip.window-seconds=${RATELIMIT_SEND_OTP_IP_WINDOW:60}

# Target user send-otp limit: 2 requests per 300 seconds
profmojo.ratelimit.send-otp.user.limit=${RATELIMIT_SEND_OTP_USER_LIMIT:2}
profmojo.ratelimit.send-otp.user.window-seconds=${RATELIMIT_SEND_OTP_USER_WINDOW:300}

# Trusted Proxy Configuration (default false: rely on TCP remote address to prevent header spoofing)
profmojo.ratelimit.trust-proxy-headers=${TRUST_PROXY_HEADERS:false}

# ===============================
# ACTUATOR & OBSERVABILITY
# ===============================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
management.info.env.enabled=false
management.prometheus.metrics.export.enabled=true
