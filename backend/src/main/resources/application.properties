# ===============================
# DATASOURCE
# ===============================
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/profmojo}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:profmojo}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:profmojo}}

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=false

# ===============================
# MAIL CONFIG
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ===============================
# TIMEZONE
# ===============================
spring.jackson.time-zone=Asia/Kolkata
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

app.admin.department.seeds=${ADMIN_DEPARTMENT_SEEDS:}

app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ===============================
# JWT CONFIG
# ===============================
jwt.secret=${JWT_SECRET:dev-super-secret-jwt-key-2026-profmojo-secure-signing-token}
jwt.expiration=${JWT_EXPIRATION:36000000}