version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: profmojo-db
    environment:
      POSTGRES_DB: profmojo
      POSTGRES_USER: profmojo
      POSTGRES_PASSWORD: profmojo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profmojo -d profmojo"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: profmojo-backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database connection inside Docker network
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/profmojo
      SPRING_DATASOURCE_USERNAME: profmojo
      SPRING_DATASOURCE_PASSWORD: profmojo
      SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT: 60000
      JWT_SECRET: ${JWT_SECRET:-dev-super-secret-jwt-key-2026-profmojo-secure-signing-token}
      ADMIN_DEPARTMENT_SEEDS: ${ADMIN_DEPARTMENT_SEEDS:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}

      TZ: Asia/Kolkata
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Kolkata -Djava.net.preferIPv4Stack=true"
    restart: always

  frontend:
    build: ./frontend
    container_name: profmojo-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    depends_on:
      - backend

volumes:
  postgres_data: